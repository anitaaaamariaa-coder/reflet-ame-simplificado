<!DOCTYPE html>
<html lang="es" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Mi Perfil — Reflet+Ame</title>
  <link rel="icon" type="image/svg+xml" href="../imagenes/favicon.svg" />
  <link rel="stylesheet" href="../css/css.css" />
  <link rel="stylesheet" href="../css/ui.css" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"/>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet"/>
</head>
<body>

  <div data-ui="header"></div>

  <section class="page-header">
    <div class="container">
      <h1 class="page-header__title">Mi Perfil</h1>
      <p class="page-header__subtitle">Tus datos personales y el historial de tus pedidos</p>
    </div>
  </section>

  <section class="section" style="padding-top:0">
    <div class="container">
      <div class="profile-grid">
        <aside class="profile-aside">
          <div class="profile-avatar" id="profileAvatar">U</div>
          <h3 id="profileName">Usuario</h3>
          <p style="font-size:.8rem;color:var(--text-muted);margin-top:4px" id="profileEmail"></p>
          <span class="role-tag" id="profileRole"></span>
        </aside>
        <div class="profile-panel">
          <h3 style="font-family:var(--font-display);font-weight:400;margin-bottom:20px">Información personal</h3>
          <div id="profileInfo"></div>

          <h3 style="font-family:var(--font-display);font-weight:400;margin:32px 0 8px">Mis pedidos</h3>
          <div id="profileOrders">
            <p class="catalog-empty">Aún no has realizado pedidos.</p>
          </div>
        </div>
      </div>
    </div>
  </section>

  <div data-ui="footer"></div>

  <button class="back-to-top" id="backToTop" aria-label="Volver arriba">
    <i class="fa-solid fa-chevron-up"></i>
  </button>

  <script src="../js/store.js"></script>
  <script src="../js/ui.js"></script>
  <script src="../js/perfil.js"></script>
</body>
</html>
